$kind: http-request
name: 'POST /api/v1/orders'
method: POST
url: '{{base_url}}/api/v1/orders'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{jwt_token}}'
body:
  type: json
  content: |-
    {
      "items": [
        {
          "productId": "replace-with-product-id",
          "quantity": 1
        }
      ]
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const token = pm.environment.get('jwt_token');
      
      if (!token) {
        throw new Error('Missing jwt_token in Development environment. Run login first.');
      }
      
      pm.request.headers.upsert({
        key: 'Authorization',
        value: `Bearer ${token}`
      });
